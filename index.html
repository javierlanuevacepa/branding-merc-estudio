const T=[
{n:"Fundamentos del marketing",c:"#1e2a78",t:"Necesidad, deseo, demanda, intercambio y orientaciones del marketing.",
s:"<p>El marketing estudia cómo se identifican y satisfacen necesidades mediante intercambios que generan valor para ambas partes. Su punto de partida son tres conceptos que conviene no confundir. La <b>necesidad</b> es un estado de carencia o insatisfacción (por ejemplo, el hambre): es algo que la persona siente, no algo que la empresa cree. El <b>deseo</b> es el anhelo de superar esa carencia de una forma concreta (querer sushi y no cualquier comida): está moldeado por la cultura, la personalidad y la oferta disponible. La <b>demanda</b> es la conducta orientada a adquirir un producto o servicio específico (hacer el pedido). La clave está en que tener una necesidad no basta: debe existir el deseo de satisfacerla y la disposición a actuar para que se convierta en demanda.</p><p>El marketing se materializa a través del <b>intercambio</b>, que requiere cinco condiciones: dos partes, bienes o servicios, comunicación entre ellas, interés mutuo y libertad para aceptar o rechazar. Cuando el intercambio se concreta se llama <b>transacción</b>, y su consecuencia es que ambas partes quedan en mejor situación que antes: se generó valor. Si una de las dos no gana, no hay marketing real, solo una imposición.</p><p>La disciplina evolucionó en tres orientaciones. La <b>orientación al producto</b> supone que un buen producto a precio razonable se vende solo: la empresa se concentra en producir y confía en la calidad. La <b>orientación a la venta</b> (desde la Depresión del 30 hasta 1950) surge cuando hay excedentes y la empresa debe empujar lo que produce con publicidad y fuerza de ventas agresiva. La <b>orientación al marketing</b> invierte la lógica: primero se estudia al cliente y luego se produce; la venta es el resultado, no el fin. Esta última es la que domina hoy.</p><p>Finalmente, la diferencia entre <b>estrategia</b> y <b>plan</b>: la estrategia es un conjunto de acciones (tácticas) para lograr un objetivo en un ambiente competitivo, y su rasgo distintivo es que <b>anticipa las acciones de otros agentes</b> (competidores, reguladores, clientes). Un plan que ignora a la competencia es solo un plan: una lista de tareas sin lectura del entorno.</p>",
cards:[["Necesidad, deseo y demanda","Necesidad: estado de carencia o insatisfacción. Deseo: anhelo de superar esa carencia. Demanda: conducta orientada a adquirir productos o servicios específicos. Tener una necesidad no basta: debe existir el deseo de satisfacerla."],

["¿Cuál es la diferencia entre deseo y demanda?",["El deseo es el anhelo; la demanda es la conducta de adquirir","El deseo es fisiológico; la demanda es social","El deseo es individual; la demanda es colectiva","El deseo es económico; la demanda es cultural"],"El deseo es el anhelo de superar la carencia; la demanda es la conducta orientada a adquirir un producto específico."],
["¿Qué caracteriza a la orientación a la venta?",["Se vende lo producido sin importar el cliente (Depresión del 30 a 1950)","Se produce solo lo que el cliente pide","Se prioriza la calidad del producto","Se elimina la publicidad"],"La orientación a la venta va desde la Depresión del 30 hasta 1950."],

{n:"¿Qué es una marca?",c:"#e0307a",t:"Definición, valor y naturaleza económica de la marca (Leuthesser y MSI).",
s:"<p>Una marca es, en su definición más simple, <b>un nombre, un término, un símbolo y/o un diseño especial</b> con el cual se trata de identificar los bienes o servicios de una empresa en particular. Es decir, la marca no es el producto: es la capa de significado que permite distinguir ese producto de otros iguales o similares. El material la descompone en tres elementos: <b>MARCA = NOMBRE COMERCIAL + LOGOTIPO + ISOTIPO</b>. El nombre comercial es el componente verbal (cómo se llama), el logotipo es la representación gráfica del nombre y el isotipo es el símbolo o ícono que la acompaña. Los tres juntos construyen la identidad reconocible de la empresa.</p><p>Más allá de la definición formal, la marca tiene una <b>naturaleza económica</b> que el material explica con dos autores. Para <b>Leuthesser</b>, la marca es «el valor (para los clientes) adicional de un producto respecto del que tendría otro producto idéntico sin la marca». Esto significa que dos productos físicamente iguales pueden valer cosas distintas para el consumidor solo por la marca que llevan: la marca agrega valor percibido. Para el <b>Marketing Science Institute</b>, la marca es «la ventaja competitiva, sostenible y diferenciada respecto de los competidores que se traduce en un mayor volumen o un mayor margen para la empresa». Aquí el foco está en el resultado económico: una marca fuerte permite vender más (volumen) o vender más caro (margen). Las dos definiciones se complementan: Leuthesser mira desde el cliente; el MSI, desde la empresa.</p><p>La conclusión importante es que <b>la marca no es solo un símbolo visual</b>: es un activo que genera valor, diferenciación y ventaja competitiva sostenible en el tiempo. Por eso las empresas invierten en construirla, protegerla y gestionarla con la misma seriedad que cualquier otro activo.</p>",

["Definición completa de marca","Un nombre, un término, un símbolo y/o un diseño especial con el cual se trata de identificar los bienes o servicios de una empresa en particular."],

["Marca según Marketing Science Institute","«Ventaja competitiva, sostenible y diferenciada respecto de los competidores que se traduce en un mayor volumen o un mayor margen para la empresa»."],

["Según el Marketing Science Institute, la marca es…",["Una ventaja competitiva sostenible que se traduce en mayor volumen o margen","Solo un nombre comercial y un logotipo","Un símbolo sin valor económico","El precio del producto en el mercado"],"La marca es ventaja competitiva, sostenible y diferenciada respecto de los competidores."],
["¿Cómo se compone una marca?",["Nombre comercial + logotipo + isotipo","Nombre + eslogan + precio","Logo + color + tipografía","Producto + precio + plaza"],"MARCA = NOMBRE COMERCIAL + LOGOTIPO + ISOTIPO."],
["¿Qué es una marca según la definición simple?",["Un nombre, término, símbolo y/o diseño que identifica bienes o servicios","Solo el logotipo","El precio del producto","El eslogan publicitario"],"Es el nombre, término, símbolo y/o diseño especial con el cual se identifican los bienes o servicios."],

["¿Qué diferencia a la marca de un producto genérico?",["El valor adicional que percibe el cliente","El precio más bajo","La calidad superior siempre","La cantidad de publicidad"],"Leuthesser define la marca como el valor adicional respecto de un producto idéntico sin marca."],

["¿Cuántos elementos componen una marca según el material?",["3: nombre comercial, logotipo e isotipo","2: nombre y logo","4: nombre, logo, eslogan y color","5: nombre, logo, eslogan, color y tipografía"],"MARCA = NOMBRE COMERCIAL + LOGOTIPO + ISOTIPO."],

{n:"Identidad de marca y branding",c:"#c2185b",t:"Identidad vs. imagen, tres dimensiones y conexión emocional.",
s:"<p>La <b>identidad de marca</b> es el conjunto de elementos que la empresa construye para expresar quién es y cómo quiere ser reconocida. No es lo que la gente percibe: es la intención deliberada de la empresa. Se compone de <b>tres dimensiones</b> que deben ser coherentes entre sí. La dimensión <b>conceptual</b> define el propósito, los valores y la personalidad de la marca: es el «para qué existe» y el «cómo es». La dimensión <b>verbal</b> se refiere al nombre, el tono y el lenguaje: cómo habla la marca. La dimensión <b>visual</b> incluye el logotipo, el isotipo, la tipografía, el color y el sistema gráfico: cómo se ve. Las tres juntas construyen la identidad proyectada.</p><p>La <b>imagen</b>, en cambio, es lo que las personas efectivamente perciben. La diferencia es crucial: la identidad se construye y se proyecta; la imagen se forma en la mente del consumidor a partir de la experiencia y de múltiples fuentes. Pueden coincidir o no. Si no coinciden, hay un problema de posicionamiento. La estrategia de posicionamiento es la que orienta la identidad; la imagen es la que revela si esa identidad fue bien interpretada. La efectividad del posicionamiento depende de tres condiciones: relevancia (que importe al cliente), diferenciación (que se distinga de la competencia) y coherencia (que identidad e imagen estén alineadas).</p><p>El <b>branding</b> es el proceso de creación de la marca. Tiene que ver con la identidad: destaca valores y conceptos asociados a un modo de vida concreto, a una forma de sentir, vivir y pensar. El branding se dirige a los <b>sentimientos y a los deseos más profundos</b>, no solo a la razón. Por eso Nike, Microsoft o Coca-Cola no solo ofrecen productos, sino un concepto, actitudes e ideas concretas. Las marcas que logran esto se convierten en <b>auténticos iconos culturales</b> donde se reflejan los gustos y apetencias de los ciudadanos. La marca deja de ser un simple identificador y pasa a ser parte del paisaje cultural.</p>",
cards:[["Identidad vs. imagen","Identidad: lo que la marca construye y proyecta (dimensión conceptual, verbal y visual). Imagen: lo que las personas perciben."],
["Tres dimensiones de la identidad","Conceptual: propósito, valores, personalidad. Verbal: nombre, tono, lenguaje. Visual: logotipo, isotipo, tipografía, color, sistema gráfico."],
["Branding y conexión emocional","El branding tiene que ver con la identidad de la marca. Destaca valores y conceptos asociados a un modo de vida. Se dirige a los sentimientos y a los deseos más profundos."],
["Marcas como iconos culturales","Nike, Microsoft o Coca-Cola no solo ofrecen productos, sino un concepto, actitudes e ideas concretas. Muchas marcas se convierten en auténticos iconos culturales donde se reflejan los gustos y apetencias de los ciudadanos."],
["Dimensión conceptual","Propósito, valores, personalidad de la marca."],
["Dimensión verbal","Nombre, tono, lenguaje de la marca."],
["Dimensión visual","Logotipo, isotipo, tipografía, color, sistema gráfico."],
["Flujo identidad → imagen","La estrategia de posicionamiento orienta la identidad que la empresa construye y proyecta; la imagen refleja cómo el mercado objetivo interpreta esa identidad. La efectividad depende de la relevancia, diferenciación y coherencia entre ambas."]],

{n:"Estrategias de marca y mezcla",c:"#d81b60",t:"Ancho, extensión, profundidad y consistencia; tipos de estrategias de marca.",
s:"<p>Para decidir cómo crecer, primero hay que saber qué se tiene. La <b>mezcla de productos</b> se mide en cuatro dimensiones que se confunden fácilmente. El <b>ancho</b> es el número de líneas comercializadas (cuántas categorías distintas vende la empresa). La <b>extensión</b> es el total de artículos por línea (cuántos productos hay dentro de cada categoría). La <b>profundidad</b> es el número de versiones de cada producto (tamaños, sabores, formatos). La <b>consistencia</b> mide qué tan relacionadas están las líneas entre sí (qué tanto comparten canales, clientes o tecnología). Una empresa puede tener mucho ancho y poca profundidad, o al revés; cada combinación implica una estrategia distinta.</p><p>Con esa base, existen <b>cuatro estrategias de marca</b>. La <b>extensión de línea</b> es lanzar un nuevo producto dentro de la misma categoría: un nuevo sabor, un nuevo tamaño, una versión light. Aprovecha la marca existente y el canal ya construido. La <b>extensión de marca</b> es lanzar un producto en una nueva clase bajo la misma marca: BIC, que era de lapiceras, lanza afeitadoras y encendedores. Es más arriesgada porque la marca debe ser creíble en la nueva categoría. Las <b>multimarcas</b> consisten en crear marcas adicionales en la misma clase para segmentos diferentes: Toyota crea Lexus para el segmento de lujo, sin canibalizar su marca principal. Las <b>marcas nuevas</b> implican lanzar una marca completamente nueva para una categoría nueva: si BIC decidiera hacer cepillos de dientes, probablemente no usaría su marca, sino una nueva. Cada estrategia tiene un costo, un riesgo y un retorno distinto, y la elección depende del objetivo de crecimiento y de la solidez de la marca.</p><p>Un caso extremo es el <b>marketing personalizado</b>: llevar la segmentación al límite y ofrecer productos y mensajes a medida de cada cliente individual. Es la evolución natural de la lógica de segmentación, pero exige capacidades tecnológicas y operativas que no todas las empresas tienen.</p>",
cards:[["Estructura de la mezcla de productos","Ancho: número de líneas. Extensión: total de artículos por línea. Profundidad: versiones de cada producto. Consistencia: qué tan relacionadas están las líneas."],

{n:"Posicionamiento: concepto",c:"#0a7d8c",t:"Lugar en la mente del consumidor, propósito y estrategias.",
s:"<p>El <b>posicionamiento</b> es el lugar que ocupa una marca o producto en la mente de los consumidores, en relación con atributos relevantes y con las marcas o productos de la competencia. No es lo que la empresa dice de sí misma: es lo que el consumidor efectivamente piensa. Al Ries y Jack Trout lo resumen de forma memorable: «El posicionamiento es lo que las personas piensan sobre tu marca, no lo que tú dices que es». Esta frase captura la esencia: el posicionamiento se construye en la mente del consumidor, no en el departamento de marketing.</p><p>El <b>propósito del posicionamiento</b> es doble. Primero, darle un significado a un producto que lo distinga de otros: que el consumidor sepa qué es y por qué es diferente. Segundo, inducir a la gente a querer comprarlo: el significado debe ser relevante y atractivo, no solo distinto. Una marca puede ser muy diferente y aun así no interesarle a nadie; el posicionamiento efectivo une diferenciación con relevancia.</p><p>Existen varias <b>estrategias de posicionamiento</b>, y cada una elige un eje distinto. <b>Por atributo</b>: destacar una característica del producto (tamaño, durabilidad, ingrediente). <b>Por beneficio</b>: destacar lo que el producto entrega al consumidor (Volvo = seguridad; Crest = control de caries). <b>Por uso o aplicación</b>: asociarlo a un momento o situación de uso. <b>Por usuario</b>: dirigirse a un tipo específico de consumidor. <b>Por estilo de vida</b>: asociarse a un modo de vida o a una forma de sentir y pensar. <b>Frente a la competencia</b>: posicionarse como líder o como seguidor, reconociendo al líder y definiéndose en relación a él. <b>Por calidad o precio</b>: definir la marca por su nivel de calidad o por su precio (por ejemplo, «la más barata»). La elección depende del mercado, de la competencia y de los recursos de la marca.</p>",
cards:[["Posicionamiento","Lugar que ocupa una marca en la mente de los consumidores, respecto de atributos relevantes y de la competencia. Ries y Trout: es lo que las personas piensan de tu marca, no lo que tú dices."],

{n:"Proceso de segmentación a posicionamiento",c:"#006064",t:"Los 5 pasos y el flujo identidad→imagen con retroalimentación.",
s:"<p>El posicionamiento no surge de la nada: es el resultado de un <b>proceso de cinco pasos</b> que conecta la segmentación del mercado con la posición deseada. El proceso se inicia antes del posicionamiento mismo y lo condiciona por completo.</p><p><b>Paso 1 — Segmentos</b>: identificar y seleccionar segmentos de mercado atractivos. No se trata de segmentar por segmentar, sino de elegir aquellos grupos que justifican la inversión. <b>Paso 2 — Oportunidades de valor</b>: para cada segmento elegido, definir las necesidades y las oportunidades de agregar valor. Se analiza qué le falta al cliente y qué se le puede ofrecer. <b>Paso 3 — Ajuste de capacidades y oportunidades</b>: evaluar y alinear las capacidades de la empresa (qué sabe hacer, qué recursos tiene) con las oportunidades identificadas. Si la empresa no puede atender el segmento, no sirve de nada. <b>Paso 4 — Objetivos</b>: establecer objetivos de marketing y de negocio para cada segmento. No basta con querer atenderlo: hay que fijar metas medibles. <b>Paso 5 — Posicionamiento deseado</b>: definir la propuesta de valor y el posicionamiento que se quiere lograr en la mente del cliente. Este es el punto de llegada del proceso.</p><p>El proceso se conecta con el posicionamiento real a través de un <b>flujo identidad → imagen</b>. La estrategia de posicionamiento orienta la identidad que la empresa construye y proyecta. Esa identidad se manifiesta en la comunicación, los productos, las experiencias y todos los puntos de contacto donde la marca se hace presente. La <b>imagen</b>, en cambio, es lo que el mercado objetivo efectivamente construye respecto de la marca: puede coincidir o no con la identidad proyectada, y depende de la relevancia y credibilidad de la propuesta. La efectividad del posicionamiento depende de tres condiciones: relevancia, diferenciación y coherencia entre identidad e imagen.</p><p>Finalmente, el proceso incluye una <b>retroalimentación y medición</b>: se compara el posicionamiento deseado con la imagen percibida para ajustar la estrategia. Es un ciclo de mejora continua. Si la imagen se aleja del posicionamiento deseado, hay que corregir el rumbo; si se acerca, hay que reforzarlo.</p>",

{n:"Errores y diferenciación",c:"#00838f",t:"Sobre/sub/dudoso/confuso y los 4 pasos para diferenciarse.",
s:"<p>Posicionar mal es tan frecuente como posicionar bien. El material identifica <b>cuatro errores típicos</b>. El <b>sobre-posicionamiento</b> ocurre cuando la imagen de la marca es demasiado estrecha: el consumidor la asocia a un solo atributo y no ve otras posibilidades. Por ejemplo, una marca que solo se conoce por «barata» puede no ser considerada para un segmento premium. El <b>sub-posicionamiento</b> es lo opuesto: la marca no tiene una idea clara en la mente del consumidor, su posicionamiento es vago. El consumidor no sabe bien qué es ni por qué debería elegirla. El <b>posicionamiento dudoso</b> aparece cuando la marca promete algo que el consumidor no cree posible: la promesa es tan grande que genera escepticismo. El <b>posicionamiento confuso</b> se produce cuando la marca cambia su posicionamiento con frecuencia o apunta a segmentos contradictorios: el consumidor no logra fijar una idea.</p><p>Para no caer en estos errores y construir un posicionamiento sólido, Trout y Rivkin proponen <b>cuatro pasos para diferenciarse</b>. El primero es <b>hacer que el contexto tenga sentido</b>: entender el mercado, la competencia y el momento; sin contexto, la diferenciación no se sostiene. El segundo es <b>encontrar la idea de diferenciación</b>: identificar aquello que hace única a la marca y que es relevante para el cliente. El tercero es <b>ofrecer pruebas</b>: dar sustento a la diferencia para que sea creíble; las promesas sin pruebas se vuelven dudosas. El cuarto es <b>comunicar la diferencia</b>: llevar el mensaje al mercado de forma consistente y clara. Sin comunicación, la diferencia no llega al consumidor.</p><p>La <b>efectividad del posicionamiento</b> depende de tres condiciones que se repiten en el material: <b>relevancia</b> (que le importe al cliente), <b>diferenciación</b> (que se distinga de la competencia) y <b>coherencia</b> (que la identidad proyectada y la imagen percibida estén alineadas). Si falla una de las tres, el posicionamiento se debilita.</p>",
cards:[["Errores de posicionamiento","Sobre-posicionamiento (imagen muy estrecha), sub-posicionamiento (idea vaga), posicionamiento dudoso (promesas poco creíbles) y confuso (cambia seguido o apunta a segmentos distintos)."],
["Sobre-posicionamiento","La imagen de la marca es demasiado estrecha: el consumidor solo la asocia a un atributo y no ve otras posibilidades."],

["¿Cuál es el primer paso para diferenciarse según Trout y Rivkin?",["Hacer que el contexto tenga sentido","Ofrecer pruebas","Comunicar la diferencia","Encontrar la idea diferenciadora"],"El primer paso es hacer que el contexto tenga sentido."],

{n:"Segmentación de mercado",c:"#b25e00",t:"Segmentos y estrategias de mercado meta (masiva, uni, multi).",
s:"<p>Segmentar es dividir el mercado en grupos con características similares que reaccionan de forma parecida a ciertos estímulos. No se trata de agrupar por agrupar: se trata de identificar grupos que justifiquen una propuesta diferenciada. Un <b>segmento de mercado</b> es, precisamente, un grupo de personas con características similares que reaccionan de forma parecida. Para que sea útil, debe cumplir tres requisitos: ser <b>medible</b> (se puede cuantificar su tamaño y características), ser <b>accesible</b> (se puede llegar a él con los canales disponibles) y ser de <b>tamaño suficiente</b> (justifica la inversión).</p><p>Una vez definidos los segmentos, hay que elegir una <b>estrategia de mercado meta</b>. La <b>estrategia masiva</b> aplica una sola estrategia para todo el mercado: se comporta como una «escopeta», dispara a todo. Es eficiente en costos pero ignora las diferencias entre segmentos. La <b>estrategia uni-segmento</b> se dirige a un solo segmento específico: concentra todos los recursos en un grupo, lo que permite una propuesta muy ajustada pero deja a la empresa expuesta a los cambios en ese segmento. La <b>estrategia multi-segmento</b> se dirige a varios segmentos a la vez: se comporta como un «rifle», apunta a varios objetivos. Permite diversificar el riesgo y aprovechar economías de escala, pero exige más recursos y coordinación.</p><p>El extremo de la segmentación es el <b>marketing personalizado</b>: en lugar de agrupar, se adapta la propuesta a cada cliente individual. Es posible gracias a la tecnología y a los datos, pero exige capacidades operativas que no todas las empresas tienen. La elección de la estrategia depende de los recursos, del mercado y de los objetivos de la empresa.</p>",
cards:[["Segmento de mercado","Grupo de personas con características similares que reaccionan de forma parecida a ciertos estímulos. Debe ser medible, accesible y de tamaño suficiente."],
["Estrategia masiva","Una sola estrategia para todo el mercado («escopeta»)."],
["Estrategia uni-segmento","Dirigida a un solo segmento específico."],
["Estrategia multi-segmento","Dirigida a varios segmentos a la vez («rifle»)."],
["Marketing personalizado","La segmentación llevada al extremo: productos y mensajes a medida del cliente individual."]],

["¿Qué estrategia de mercado meta usa la «escopeta»?",["Masiva","Uni-segmento","Multi-segmento","Personalizada"],"La estrategia masiva es como una escopeta: una sola estrategia para todo el mercado."],
["La segmentación llevada al extremo se llama…",["Marketing personalizado","Marketing masivo","Marketing indiferenciado","Marketing concentrado"],"La segmentación extrema es el marketing personalizado."],

["¿Qué significa que el segmento sea «medible»?",["Que se pueda cuantificar su tamaño y características","Que sea accesible","Que sea de tamaño suficiente","Que sea rentable"],"El segmento debe ser medible, accesible y de tamaño suficiente."],
["¿Qué significa que el segmento sea «accesible»?",["Que se pueda llegar a él con los canales disponibles","Que se pueda medir","Que sea grande","Que sea rentable"],"Accesible: se puede llegar al segmento con los canales disponibles."],
["¿Qué busca la estrategia masiva?",["Aplicar una sola estrategia a todo el mercado","Dirigirse a un solo segmento","Dirigirse a varios segmentos","Personalizar productos"],"Estrategia masiva: una sola estrategia para todo el mercado."],
["¿Qué busca la estrategia uni-segmento?",["Dirigirse a un solo segmento","Aplicar una sola estrategia a todo el mercado","Dirigirse a varios segmentos","Personalizar productos"],"Uni-segmento: dirigida a un solo segmento."],
["¿Qué busca la estrategia multi-segmento?",["Dirigirse a varios segmentos a la vez","Aplicar una sola estrategia a todo el mercado","Dirigirse a un solo segmento","Personalizar productos"],"Multi-segmento: dirigida a varios segmentos a la vez."],
["¿Por qué importa el tamaño del segmento?",["Debe ser suficiente para justificar la inversión","Debe ser pequeño para ser exclusivo","Debe ser grande para ser barato","No importa el tamaño"],"El segmento debe ser de tamaño suficiente."],
["¿Cuál de estos NO es un requisito del segmento?",["Que sea rentable en el corto plazo","Que sea medible","Que sea accesible","Que sea de tamaño suficiente"],"Los requisitos son: medible, accesible y de tamaño suficiente."],

["¿Cuál es la diferencia entre estrategia masiva y personalizada?",["La masiva aplica una estrategia para todos; la personalizada adapta a cada cliente","Son lo mismo","La masiva es más cara","La personalizada es más antigua"],"La masiva es una sola estrategia para todo el mercado; la personalizada adapta productos y mensajes a cada cliente."],
["¿Cuál es el riesgo de no segmentar?",["Dirigirse a un mercado heterogéneo con una sola propuesta","Aumentar las ventas","Reducir costos","Mejorar la publicidad"],"Segmentar permite ajustar la propuesta a grupos con características similares."]]},
{n:"Roles de compra y sesgos",c:"#e65100",t:"Iniciador, influenciador, decisor, comprador, consumidor y sesgos cognitivos.",
s:"<p>Comprar no es un acto individual: es un <b>proceso con varios roles</b> que pueden recaer en la misma persona o en personas distintas. El material identifica cinco. El <b>iniciador</b> detecta la necesidad y pone en marcha el proceso (el hijo que pide una mascota). El <b>influenciador</b> aporta información o criterios que condicionan la decisión (el amigo que recomienda una marca). El <b>decisor</b> toma la decisión final: define qué se compra, cuándo, dónde, a quién y en qué condiciones. El <b>comprador</b> ejecuta la compra (va a la tienda o hace el pedido). El <b>consumidor</b> usa el producto. La clave es que el consumidor no siempre es el iniciador, el decisor ni el comprador: en una familia, el niño puede ser el consumidor, la madre la decisora y el padre el comprador. Entender estos roles es fundamental para diseñar la comunicación y los canales.</p><p>Además de los roles, la decisión de compra está atravesada por <b>sesgos cognitivos</b>, estudiados por Kahneman y Tversky. El <b>anclaje</b> hace que un primer valor numérico condicione la percepción de los siguientes: un producto rebajado de $100.000 a $60.000 parece barato porque el primer número funciona como ancla. La <b>disponibilidad</b> hace que se recuerde lo más fácil de evocar: si un caso reciente está en la mente, se sobreestima su frecuencia. La <b>representatividad</b> lleva a generalizar a partir de un caso puntual. La <b>aversión a la pérdida</b> implica que las pérdidas duelen más que las ganancias equivalentes. El <b>efecto marco</b> muestra que el mismo contenido presentado de forma distinta cambia la percepción: «90% libre de grasa» atrae más que «contiene 10% de grasa». El <b>efecto halo</b> hace que una característica positiva (o negativa) se extienda a toda la marca o persona.</p>",
cards:[["Roles en el proceso de compra","Iniciador, influenciador, decisor, comprador y consumidor. El consumidor no siempre es el iniciador, el decisor ni el comprador."],
["Sesgos cognitivos","Anclaje, disponibilidad, representatividad, aversión a la pérdida, efecto marco y efecto halo (Kahneman y Tversky)."],
["Anclaje","Un primer valor numérico condiciona la percepción de los siguientes (ej. un producto rebajado de $100.000 a $60.000 parece barato)."],

["Disponibilidad y representatividad","Disponibilidad: se recuerda lo más fácil de evocar. Representatividad: se generaliza a partir de un caso puntual."]],

["¿Quién inicia el proceso de compra?",["El iniciador","El decisor","El comprador","El consumidor"],"El iniciador es quien detecta la necesidad."],
["El efecto halo hace que…",["Una característica positiva se extienda a toda la marca","El precio parezca más bajo","Se recuerde lo más reciente","Se compare con un ancla"],"El efecto halo extiende una percepción positiva (o negativa) al conjunto."],
["¿Quién aporta información para la decisión?",["El influenciador","El iniciador","El decisor","El consumidor"],"El influenciador aporta información para la decisión."],

["¿Qué es la aversión a la pérdida?",["Duele más perder que ganar","Se recuerda lo más reciente","Se generaliza a partir de un caso","Una característica se extiende al conjunto"],"Aversión a la pérdida: las pérdidas duelen más que las ganancias equivalentes."],

["¿Quiénes propusieron los sesgos mencionados?",["Kahneman y Tversky","Ries y Trout","Kotler y Keller","Levitt y Godin"],"Los sesgos cognitivos mencionados son de Kahneman y Tversky."],
["¿El consumidor es siempre el decisor de compra?",["No, pueden ser personas distintas","Sí, siempre","Solo en productos caros","Solo en productos baratos"],"El consumidor no siempre es el iniciador, el decisor ni el comprador."],
["¿Qué sesgo describe «se recuerda lo más fácil de evocar»?",["Disponibilidad","Anclaje","Efecto marco","Efecto halo"],"Disponibilidad: se recuerda lo más fácil de evocar."],

{n:"Producto, precio, plaza y promoción",c:"#5b3fb0",t:"Clasificación de bienes, matriz BCG, canales, push/pull y AIDA.",
s:"<p>El marketing mezcla cuatro variables clásicas: producto, precio, plaza y promoción. En el nivel del producto, los <b>bienes de consumo</b> se clasifican según el esfuerzo de compra. Los <b>de conveniencia</b> se compran con mínimo esfuerzo (pan, leche): son frecuentes, baratos y de decisión rápida. Los <b>de selección</b> implican comparar calidad, precio y estilo (ropa, electrodomésticos): el consumidor dedica tiempo a evaluar. Los <b>de especialidad</b> tienen una fuerte preferencia de marca y justifican un esfuerzo especial de compra (una marca de reloj por la que se viaja a otra ciudad). Los <b>no buscados</b> son aquellos que el consumidor no busca activamente (seguros de vida, donaciones).</p><p>La <b>matriz BCG</b> clasifica los productos según su crecimiento de mercado y su participación. La <b>estrella</b> tiene alto crecimiento y alta participación: es el futuro de la empresa y exige inversión. La <b>vaca</b> genera ingresos con baja inversión: ya está madura y financia a las demás. La <b>interrogación</b> tiene alto crecimiento pero baja participación: el futuro es incierto y hay que decidir si invertir o abandonar. El <b>perro</b> está en la última etapa del ciclo de vida: bajo crecimiento y baja participación.</p><p>En la plaza o distribución, los canales pueden ser <b>intensivos</b> (la mayor cantidad de puntos de venta), <b>selectivos</b> (algunos puntos elegidos) o <b>exclusivos</b> (pocos puntos, alta exclusividad). En promoción, la estrategia <b>push</b> empuja el producto hacia los intermediarios para que lo exhiban y lo vendan; la <b>pull</b> genera demanda en el consumidor final para que lo pida. Un principio clave: se pueden eliminar intermediarios, pero no sus funciones (transporte, almacenamiento, financiamiento); alguien tiene que hacerlas. Finalmente, el <b>modelo AIDA</b> (atención, interés, deseo, acción) estructura la comunicación para que el cliente avance paso a paso hacia una acción concreta.</p>",
cards:[["Bienes de consumo","De conveniencia (mínimo esfuerzo), de selección (se comparan calidad, precio y estilo), de especialidad (fuerte preferencia de marca) y no buscados."],

{n:"Cliente, experiencia y estrategia",c:"#2f7d32",t:"Customer journey, NPS, tipos de cliente y miopía de marketing.",
s:"<p>El <b>viaje del cliente</b> (customer journey) describe las etapas por las que pasa una persona en su relación con la marca: <b>descubrir</b>, <b>evaluar</b>, <b>adquirir</b>, <b>servicio</b> y <b>lealtad</b>. Se recuerdan los hitos, más como fotos que como película: el cliente no vive un flujo continuo, sino momentos significativos que fijan la percepción. Gestionar cada etapa es clave para construir una experiencia coherente.</p><p>No todos los clientes son iguales. El material los clasifica en cuatro tipos. Los <b>apóstoles</b> son clientes satisfechos que recomiendan la marca activamente: son el activo más valioso. Los <b>mercenarios</b> buscan siempre el precio más bajo y cambian de marca sin fidelidad. Los <b>rehenes</b> tienen una mala experiencia pero no pueden cambiar por contratos o costos de cambio: están atrapados. Los <b>terroristas</b> son clientes frustrados que abandonan en cuanto pueden y pueden dañar la reputación de la marca.</p><p>Para medir la relación con el cliente, el <b>NPS (Net Promoter Score)</b> pregunta la probabilidad de recomendar en una escala de 0 a 10 y el motivo de la respuesta. Es simple, comparable entre empresas y muy usado porque una sola pregunta captura la disposición del cliente a defender la marca.</p><p>Finalmente, la <b>miopía de marketing</b> (Levitt) es uno de los conceptos más citados: consiste en definir el negocio por el producto y no por la necesidad que satisface. Los ferrocarriles creyeron estar en el negocio ferroviario, cuando en realidad estaban en el negocio del transporte; por eso no reaccionaron a la competencia del automóvil y el avión. La miopía lleva a la empresa a enamorarse de su producto y olvidar al cliente. Según <b>Seth Godin</b>, el buen marketing se fundamenta en la <b>empatía</b>: es más fácil crear productos para clientes a quienes quieres servir que buscar clientes para tus productos.</p>",
cards:[["Viaje del cliente","Etapas: descubrir, evaluar, adquirir, servicio y lealtad. Se recuerdan los hitos, más como fotos que como película."],
["Satisfacción y lealtad","Apóstoles (satisfechos que recomiendan), mercenarios (buscan precio), rehenes (mala experiencia pero no pueden cambiar) y terroristas (frustrados que abandonan)."],
["Net Promoter Score","Mide la probabilidad de recomendar: escala de 0 a 10 y el motivo de la respuesta. Es simple y comparable entre empresas."],
["Miopía de marketing (Levitt)","Definir el negocio por el producto y no por la necesidad que satisface: los ferrocarriles creyeron estar en el negocio ferroviario, no en el del transporte."]],
q:[["Según Levitt, ¿qué refleja la miopía de marketing?",["Definir el negocio por el producto y no por la necesidad","Vender sin conocer al cliente","Confiar solo en la calidad","Priorizar la eficiencia productiva"],"Los ferrocarriles estaban en el negocio del transporte."],

{n:"Pirámide de marca",c:"#8b2d5a",t:"Los 5 niveles y los ejemplos de Apple y Volvo.",
s:"<p>La <b>pirámide de marca</b> es una herramienta para ordenar los significados de una marca en cinco niveles, de lo más tangible a lo más intangible. Se lee de abajo hacia arriba, y cada nivel se apoya en el anterior.</p><p><b>Nivel 1 — Atributos del producto</b>: son las características tangibles (tamaño, color, peso, materiales, diseño, sabor, aroma, cantidad). Es la base de la pirámide: sin producto no hay marca. <b>Nivel 2 — Beneficios funcionales</b>: qué resuelve la marca para el cliente en términos de utilidad, desempeño y conveniencia. Es el paso del atributo al beneficio: no se vende el airbag, se vende la protección. <b>Nivel 3 — Beneficios emocionales</b>: los sentimientos y experiencias que genera la marca en sus clientes. <b>Nivel 4 — Carácter de marca</b>: la personalidad y manera de ser de la marca; cómo se expresa y cómo se diferencia. <b>Nivel 5 — Beneficio principal</b>: el beneficio intangible más relevante que obtiene el cliente; es la cúspide y el corazón de la marca.</p><p>El ejemplo de <b>Volvo</b> ilustra la pirámide completa. El beneficio principal es «sentirse seguro y protegido al conducir, especialmente para la familia». Los beneficios funcionales son «ayuda a prevenir accidentes, protege a los ocupantes y entrega mayor control en la conducción». Los beneficios emocionales son «tranquilidad, confianza, bienestar y control». El carácter de marca es «responsable, confiable, protectora y centrada en las personas». Los atributos del producto son «airbags, sistemas de frenado automático, sensores, asistencia a la conducción, estructura de alta resistencia y tecnologías de seguridad activa y pasiva». La pirámide muestra cómo un atributo tangible (airbags) se transforma en un beneficio funcional (protección) y luego en un beneficio emocional (tranquilidad) y en un carácter de marca (confiabilidad).</p><p>El ejemplo de <b>Apple</b> también encaja. El beneficio principal es «una mejor forma de vivir, trabajar y crear, con tecnología que se integra naturalmente en la vida de las personas». Los beneficios funcionales son «facilita la vida, aumenta la productividad, es intuitivo, confiable y ofrece un ecosistema integrado de dispositivos y servicios». El carácter de marca es «innovadora, simple, premium, creativa y centrada en las personas. Inspira a pensar distinto».</p>",

{n:"Modelos de arquitectura de marca",c:"#6a1b9a",t:"Monolítica, endosada, independientes y mixta; portafolio Nestlé.",
s:"<p>La <b>arquitectura de marca</b> es, según Kotler & Keller, «la forma en que una empresa organiza y estructura sus marcas, productos y servicios para optimizar el valor de cada una y de la organización en su conjunto». No se trata solo de poner nombres: se trata de decidir cómo se relacionan las marcas entre sí para maximizar el valor total. Existen cuatro modelos principales.</p><p>El modelo <b>monolítico</b> (Branded House) usa una única marca para todas las líneas de productos y negocios. El ejemplo es <b>IKEA</b>: todas las categorías de productos utilizan la misma marca IKEA; los productos tienen nombres propios (BILLY, KALLAX, MALM), pero la marca es la misma. Ventaja: cada lanzamiento refuerza la marca única. Desventaja: si una categoría falla, puede dañar la percepción de todas las demás.</p><p>El modelo de <b>marca endosada</b> (Endorsed Brands) usa submarcas con identidad propia, pero todas respaldadas por la marca madre, que aporta confianza y sinergias. El ejemplo es <b>Nestlé</b>: Nesquik, Nescafé y Maggi tienen identidad propia, pero todas están respaldadas por Nestlé. Ventaja: se combina la flexibilidad de las submarcas con el respaldo de la marca madre. Desventaja: hay que gestionar múltiples identidades.</p><p>El modelo de <b>independientes</b> (House of Brands) usa un conjunto de marcas autónomas e independientes entre sí. Cada marca opera de forma independiente, con su propia identidad, estrategia de comunicación y posicionamiento. El ejemplo es <b>Unilever</b>: Axe, Dove y otras marcas compiten en el mismo mercado sin que el consumidor necesariamente sepa que pertenecen al mismo grupo. Ventaja: los fracasos de una marca no contaminan a las demás. Desventaja: se pierden las sinergias y economías de escala.</p><p>El modelo <b>mixto</b> (Hybrid) combina marcas de la empresa con submarcas y marcas independientes entre sí. Es el modelo más flexible y el más común en grupos grandes, porque permite adaptar la arquitectura a cada categoría.</p><p>El <b>portafolio Nestlé</b> tiene 10 líneas: Nutrición Infantil, Agua, Cereales, Chocolates y confites, Cafés y Bebidas, Culinarios, Health Science, Lácteos, Alimentos para Mascotas y Nestlé Profesional. Es un ejemplo de marca endosada a gran escala: cada submarca conserva su identidad, pero el respaldo de Nestlé aporta confianza y sinergias.</p>",

'</div></section><div class="grid">'+
T.map((t,i)=>'<button class="tc" style="--c:'+t.c+'" data-h="t'+i+'" type="button"><h3>'+E(t.n)+'</h3><p>'+E(t.t)+'</p><small>'+t.cards.filter((_,k)=>S.known[i+"-"+k]).length+' / '+t.cards.length+' tarjetas sabidas · '+t.q.length+' preguntas</small></button>').join("")+'</div>';
}

app.innerHTML='<button class="back" data-h="" type="button">Volver a los temas</button><h2 style="font-size:34px">'+E(t.n)+'</h2>'+

function draw(){if(n>=d.length){app.innerHTML='<div class="panel" style="--c:'+t.c+'"><h2>Mazo completo</h2><p>Llevas '+t.cards.filter((_,k)=>S.known[i+"-"+k]).length+' de '+t.cards.length+' tarjetas sabidas en este tema.</p><div class="row"><button class="btn" data-h="q'+i+'" type="button">Hacer el quiz (8 de '+t.q.length+')</button><button class="btn g" data-h="t'+i+'" type="button">Volver al tema</button></div></div>';return}
const c=d[n][1];app.innerHTML='<button class="back" data-h="t'+i+'" type="button">Volver al tema</button><p class="stat">Tarjeta '+(n+1)+' de '+d.length+'. Toca para ver el reverso.</p><button class="panel flip" style="--c:'+t.c+'" id="f" type="button">'+(back?'<span>'+E(c[1])+'</span>':'<b>'+E(c[0])+'</b>')+'</button>'+(back?'<div class="row"><button class="btn" id="k" type="button">Ya la sé</button><button class="btn g" id="r" type="button">Repasar después</button></div>':"");
$("#f").onclick=()=>{back=!back;draw()};
if(back){$("#k").onclick=()=>{if(!S.known[i+"-"+d[n][0]]){S.known[i+"-"+d[n][0]]=1;xp(2)}back=false;n++;draw()};$("#r").onclick=()=>{back=false;n++;draw()}}}
draw()}
function quiz(list,o){let q=o.pool?sh(o.pool).slice(0,o.pick||8):sh(list),n=0,ok=0,locked=false,end=o.timed?Date.now()+60000:0,tk;
function finish(){clearInterval(tk);cl=null;const rec=o.timed&&ok>S.flash;if(rec)S.flash=ok;xp(ok*(o.timed?5:10));
app.innerHTML='<div class="panel" style="--c:'+o.c+'"><p class="stat">'+(rec?"Nuevo récord":"Resultado")+'</p><div class="big">'+ok+(o.timed?"":" / "+q.length)+'</div><p>'+(o.timed?"respuestas correctas en 60 segundos.":"respuestas correctas.")+' Ganaste '+ok*(o.timed?5:10)+' XP.</p><div class="row"><button class="btn" id="a" type="button">'+(o.pool?"Otras 8 preguntas":"Jugar de nuevo")+'</button><button class="btn g" data-h="'+o.back+'" type="button">Volver</button></div></div>';$("#a").onclick=()=>{o.timed?go():quiz(list,o)}}
function draw(){if(n>=q.length){if(o.timed){q=sh(list);n=0}else return finish()}locked=false;const it=q[n],op=sh(it[1].map((x,k)=>[x,k===0]));
app.innerHTML='<button class="back" data-h="'+o.back+'" type="button">Salir</button><div class="panel" style="--c:'+o.c+'"><p class="stat" id="st">'+(o.timed?"":"Pregunta "+(n+1)+" de "+q.length)+'</p><p class="q">'+E(it[0])+'</p>'+op.map((x,k)=>'<button class="opt" data-k="'+k+'" type="button">'+E(x[0])+'</button>').join("")+'<p class="why" id="w" aria-live="polite"></p></div>';
const bs=[...app.querySelectorAll(".opt")];bs.forEach((b,k)=>b.onclick=()=>{if(locked)return;locked=true;bs.forEach((x,j)=>{if(op[j][1])x.classList.add("ok")});if(op[k][1])ok++;else b.classList.add("no");$("#w").textContent=o.timed?"":it[2];if(o.timed){setTimeout(()=>{n++;if(!end||Date.now()<end)draw()},600)}else{const nb=document.createElement("button");nb.className="btn";nb.type="button";nb.textContent=n+1>=q.length?"Ver resultado":"Siguiente pregunta";nb.onclick=()=>{n++;draw()};$("#w").after(nb)}});}
if(o.timed){tk=setInterval(()=>{const l=Math.ceil((end-Date.now())/1000);const s=$("#st");if(s)s.textContent="Tiempo: "+Math.max(l,0)+" s · "+ok+" puntos";if(l<=0)finish()},250);cl=()=>clearInterval(tk)}
draw()}
function simulacion(){
const q=sh(T.flatMap(t=>t.q)).slice(0,30);
let n=0,locked=false;const results=[];
function finish(){
const ok=results.filter(r=>r.chosenIdx===r.correctIdx).length;
xp(ok*10);
const pct=Math.round(ok/results.length*100);
const aprob=ok>=results.length*0.6;
const reviewHtml=results.map((r,i)=>{
const isOk=r.chosenIdx===r.correctIdx;
return '<div class="panel" style="--c:'+(isOk?'#12805c':'#c4262e')+';padding:16px 18px;margin:10px 0">'+
'<p class="stat">'+(isOk?'✅':'❌')+' Pregunta '+(i+1)+'</p>'+
'<p class="q" style="font-size:17px;margin-top:4px">'+E(r.q)+'</p>'+
'<p style="margin:6px 0;font-size:15px"><b>Tu respuesta:</b> <span style="color:'+(isOk?'var(--ok)':'var(--no)')+'">'+E(r.opts[r.chosenIdx])+'</span></p>'+
(!isOk?'<p style="margin:6px 0;font-size:15px"><b>Correcta:</b> <span style="color:var(--ok)">'+E(r.opts[r.correctIdx])+'</span></p>':'')+
'<p class="why" style="margin-top:8px">'+E(r.why)+'</p>'+
'</div>';
}).join("");
app.innerHTML='<div class="panel" style="--c:#1e2a78">'+
'<p class="stat">Resultado de la simulación</p>'+
'<div class="big">'+ok+' / '+results.length+'</div>'+
'<p>'+pct+'% de respuestas correctas. Ganaste '+(ok*10)+' XP.</p>'+
'<p style="margin-top:8px;font-weight:700;color:'+(aprob?'var(--ok)':'var(--no)')+'">'+(aprob?'✅ Aprobado (≥60%)':'⚠️ Bajo el 60% — sigue practicando')+'</p>'+
'<div class="row"><button class="btn" id="a" type="button">Simular otra vez</button><button class="btn g" data-h="" type="button">Volver al inicio</button></div>'+
'</div>'+
'<h2 style="margin-top:28px;font-size:26px">Revisión pregunta por pregunta</h2>'+
reviewHtml;
$("#a").onclick=()=>simulacion();
}
function draw(){
if(n>=q.length)return finish();
locked=false;
const it=q[n];
const op=sh(it[1].map((x,k)=>[x,k===0]));
const correctIdx=op.findIndex(x=>x[1]);
app.innerHTML='<button class="back" data-h="" type="button">Salir</button>'+
'<div class="panel" style="--c:#1e2a78">'+
'<p class="stat">Simulación de prueba · Pregunta '+(n+1)+' de '+q.length+'</p>'+
'<p class="q">'+E(it[0])+'</p>'+
op.map((x,k)=>'<button class="opt" data-k="'+k+'" type="button">'+E(x[0])+'</button>').join("")+
'</div>';
const bs=[...app.querySelectorAll(".opt")];
bs.forEach((b,k)=>b.onclick=()=>{
if(locked)return;
locked=true;
results.push({q:it[0],opts:op.map(x=>x[0]),correctIdx,chosenIdx:k,why:it[2]});
n++;
draw();
});
}
cl=null;
draw();
}
function route(){const h=location.hash.slice(1),i=+h.slice(1);
if(h==="relampago")return quiz(T.flatMap(t=>t.q),{timed:1,c:"#1e2a78",back:""});
if(h==="simulacion")return simulacion();
if(h[0]==="t"&&T[i])return topic(i);if(h[0]==="c"&&T[i])return cards(i);
if(h[0]==="q"&&T[i])return quiz([],{c:T[i].c,back:"t"+i,pool:T[i].q,pick:8});home()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-h]");if(b){const h=b.dataset.h;if(location.hash.slice(1)===h)go();else location.hash=h}});
addEventListener("hashchange",()=>{cl&&cl();cl=null;route()});
let rc=0;$("#rs").onclick=function(){if(!rc){rc=1;this.textContent="¿Seguro? Se borra todo";setTimeout(()=>{rc=0;this.textContent="Reiniciar progreso"},3000)}else{S={xp:0,known:{},flash:0};save();bar();rc=0;this.textContent="Reiniciar progreso";go()}};
bar();route();
</script></body></html>
